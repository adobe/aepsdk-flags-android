# Scheduled and manual E2E functional tests for the Flags Extension.
# Runs FlagFunctionalTests on an Android emulator (EventHub-level integration tests).
# Optional secret: SLACK_WEBHOOK_URL (Slack notification on failure).

name: E2E Functional Tests

on:
  schedule:
    # Daily at 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to use when running E2E functional tests'
        required: false
        default: 'main'
      id:
        description: 'Optional identifier for this run (shown in logs)'
        required: false

jobs:
  e2e-functional-test:
    name: Flags Extension E2E
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        api-level: [29]

    steps:
      - name: Run identifier
        run: |
          if [ -z "${{ github.event.inputs.id }}" ]; then
            echo "Run identifier: scheduled"
          else
            echo "Run identifier: ${{ github.event.inputs.id }}"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-flags-${{ matrix.api-level }}

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run E2E functional tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: make e2e-functional-test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-functional-test-results
          path: |
            code/flags/build/reports/androidTests/connected/
            code/flags/build/outputs/androidTest-results/connected/
          retention-days: 14

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,action,ref,workflow
          text: |
            E2E functional tests for the Flags Extension have failed.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
