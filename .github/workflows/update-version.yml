# Bump Flags Extension version and dependency versions via an automated pull request.
# Run before creating a release tag and publishing to Maven Central.

name: Update Versions

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version for the Flags Extension (ex: 1.0.0).'
        type: string
        required: true

      branch:
        description: 'Target branch for the version update PR (ex: main).'
        type: string
        required: true

      core-dependency:
        description: |
          If provided, update Core dependency in gradle.properties (ex: 3.5.0).
          Leave empty to skip Core dependency update.
        type: string
        required: false
        default: ''

jobs:
  update-versions:
    name: Update Flags Extension versions
    permissions:
      contents: write
      pull-requests: write
    uses: adobe/aepsdk-commons/.github/workflows/versions.yml@gha-android-3.4.3
    with:
      version: ${{ github.event.inputs.version }}
      branch: ${{ github.event.inputs.branch }}
      dependencies: Core ${{ github.event.inputs.core-dependency }}
      paths: code/gradle.properties
      update: true
    secrets: inherit
