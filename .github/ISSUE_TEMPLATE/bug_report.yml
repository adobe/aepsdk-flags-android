name: Bug report
description: Report a bug in the Flags Extension for Android.
labels: [bug, triage-required]

body:
- type: checkboxes
  attributes:
    label: Prerequisites
    description: Please check the following items before logging a new bug report.
    options:
    - label: This is not a security disclosure. For security issues, see [CONTRIBUTING](../CONTRIBUTING.md#security-issues).
      required: true
    - label: I have searched in this repository's issues to see if it has already been reported.
      required: true
    - label: I have updated to the latest version of the extension and the issue still persists.
      required: true

- type: textarea
  attributes:
    label: Bug summary
    description: Please provide a summary of the bug you are reporting.
  validations:
    required: true

- type: textarea
  attributes:
    label: Environment
    description: |
      OS version, SDK version(s), IDE version, and any other settings that help narrow down the problem.
      Example:
        - **OS**: Android 14
        - **SDK(s)**: flags 1.0.0, core 3.5.0
        - **IDE**: Android Studio Ladybug
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to reproduce
    description: Steps to reproduce the behavior consistently.
    placeholder: |
      1. ...
      2. ...
      3. ...
  validations:
    required: false

- type: textarea
  attributes:
    label: Current behavior
    description: A concise description of what you are experiencing.
  validations:
    required: false

- type: textarea
  attributes:
    label: Expected behavior
    description: A concise description of what you expected to happen.
  validations:
    required: false

- type: textarea
  attributes:
    label: Anything else?
    description: |
      Sample code, logs, or other context about the issue.

      Tip: You can attach images or log files by clicking this area and dragging files in.
  validations:
    required: false
